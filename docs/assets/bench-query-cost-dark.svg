<rect x="48" y="614" width="1104" height="209" rx="14" fill="#22242f" stroke="#e0af68" stroke-width="1.5" id="qcost-cond"/>
<rect x="72" y="634" width="119" height="26" rx="13" fill="#22242f" stroke="#e0af68" stroke-width="1.5" id="qcost-chip48"/>
<text x="131.5" y="652.04" font-size="14" font-weight="700" fill="#e0af68" text-anchor="middle" letter-spacing="0.8" data-box="qcost-chip48">CONDITION</text>
<text x="72" y="688" font-size="19" fill="#c0caf5" data-box="qcost-cond">Each run in a new, randomly named directory kept opencode's and Hermes' prompts out of the cache (their</text>
<text x="72" y="715" font-size="19" fill="#c0caf5" data-box="qcost-cond">system prompts carry per-run content, likely the path; koda's prompt has no path). With everything</text>
<text x="72" y="742" font-size="19" fill="#c0caf5" data-box="qcost-cond">cached koda is not cheaper than opencode. On edits opencode is cheaper.</text>
<text x="72" y="775" font-size="16" fill="#9aa5ce" data-box="qcost-cond">Paired ratio vs opencode / Hermes: as measured 2.5× / 4.6× · with no cache at all 1.6× / 3.6× · with every input token cached</text>
<text x="72" y="798" font-size="16" fill="#9aa5ce" data-box="qcost-cond">0.90× / 1.15×. The cache split is inferred from prompt lengths and cache counts; request bodies were not logged.</text>
<text x="48" y="859" font-size="15" fill="#9aa5ce">Run main-20260930 · 2026-09-30 12:13-12:42 UTC · deepseek-flash for all three tools, one API account · koda 0.1.0 @ 63fda57 · opencode</text>
<text x="48" y="881" font-size="15" fill="#9aa5ce">1.18.33 · Hermes Agent 2026.9.24</text>
<text x="48" y="903" font-size="15" fill="#9aa5ce">Cost = DeepSeek list price, peak basis (per 1M tokens: cache hit $0.006, miss $0.30, output $1.20); the runs were off-peak and billed at</text>
<text x="48" y="925" font-size="15" fill="#9aa5ce">50% · paired = median of the 10 same-round tool ÷ koda ratios</text>
<text x="48" y="953" font-size="16" fill="#c0caf5"><tspan >Full results (incl. where koda trails): </tspan><tspan fill="#a59ffb" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">benchmarks/</tspan></text>
</svg>
