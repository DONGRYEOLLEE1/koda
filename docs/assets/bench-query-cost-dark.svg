<text x="48" y="76" font-size="36" fill="#c0caf5"><tspan fill="#e6e9ff" font-weight="800">koda</tspan><tspan fill="#9aa5ce">  cost per run on read-only and general questions</tspan></text>
<text x="48" y="118" font-size="21" fill="#c0caf5">One-shot runs, each in a new directory: about half of opencode's cost, under a third of Hermes'.</text>
<text x="48" y="152" font-size="17" fill="#9aa5ce">Tasks e1 (code reading across modules) + f1 (general knowledge) · 10 runs per tool · every answer correct, 10/10 for all</text>
<text x="48" y="176" font-size="17" fill="#9aa5ce">three · same model, deepseek-flash</text>
<text x="48" y="234" font-size="14" font-weight="700" fill="#9aa5ce" letter-spacing="1.4">TOOL</text>
