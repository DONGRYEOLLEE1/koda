<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="983" viewBox="0 0 1200 983" role="img" aria-labelledby="qcost-title qcost-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif">
<title id="qcost-title">koda cost per run on read-only and general questions</title>
<desc id="qcost-desc">Horizontal bar chart. Median cost per run on read-only and general questions (tasks e1 and f1, 10 runs per tool, all answers correct), one-shot runs each in a new directory, DeepSeek list price, peak basis: koda $0.0015, opencode $0.0031 (2.5 times koda, paired, koda lower in 10/10 rounds), Hermes Agent $0.0050 (4.6 times, koda lower in 10/10 rounds). Condition: the new directory per run kept opencode's and Hermes' prompts out of the cache; with every input token cached the paired ratios would be 0.90x / 1.15x, so koda would not be cheaper than opencode; on edit tasks opencode is cheaper. Run main-20260930, 2026-09-30, deepseek-flash. Full results (incl. where koda trails): benchmarks/</desc>
<defs><marker id="qcost-arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#6e77a6"/></marker></defs>
