<text x="74" y="1264" font-size="15" fill="#626262">같은 라운드 비율의 중앙값 · 줄기는 1배에서 시작</text>
<text x="48" y="1290" font-size="15" fill="#626262">koda 앞섬 = 두 도구 모두 1배 초과 · koda 뒤처짐 = 한 도구라도 1배 미만 · 모두 같음 = 둘 다 1배</text>
<rect x="48" y="1324" width="1104" height="269" fill="#fafafa" rx="14" stroke="#aa6a00" stroke-width="1.5"/>
<rect x="72" y="1344" width="60.28" height="26" fill="#fafafa" rx="13" stroke="#aa6a00" stroke-width="1.5"/>
<text x="102.14" y="1362" font-size="14" fill="#8a5600" font-weight="700" text-anchor="middle" letter-spacing="0.3">조건</text>
<text x="72" y="1398" font-size="19" fill="#262626">속도와 호출: koda 는 라우터, coder, verifier 를 차례로 돌리고 필요하면 planner 와 reviewer 를 더 돌린다(편집 런당 모델</text>
<text x="72" y="1425" font-size="19" fill="#262626">호출 중앙값 20회, 두 도구는 9회와 12.5회). 검증에 실패하면 한 번 더 도는데, 편집 20런 중 3런이 그랬다(b1 r1 163초, d1 r1</text>
<text x="72" y="1452" font-size="19" fill="#262626">126초, d1 r5 128초. 과제 중앙값은 35.5초와 78.6초).</text>
<text x="72" y="1485" font-size="16" fill="#626262">¹ 런마다 이름이 무작위인 새 디렉터리를 썼다. 경로가 없는 koda 프롬프트는 런 사이에 거의 통째로 캐시됐고, 다른 두 도구의 프롬프트는 앞부분 약</text>
<text x="72" y="1508" font-size="16" fill="#626262">1.8k·2.6k 토큰만 재사용됐다. 캐시가 전혀 없을 때의 비용 배수는 1.6배 / 3.6배, 입력이 전부 캐시될 때는 0.90배 / 1.15배라서 이 질문들에서도 koda</text>
<text x="72" y="1531" font-size="16" fill="#626262">가 opencode 보다 싸지 않다. 편집 과제에서는 opencode 가 더 쌌다.</text>
<text x="72" y="1554" font-size="16" fill="#626262">opencode 의 토큰 수는 이 중 2런에서 하한값이다(계측되지 않은 요청이 런마다 1건).</text>
<text x="48" y="1629" font-size="15" fill="#626262">런 main-20260930 · 2026-09-30 12:13~12:42 UTC · 세 도구 모두 deepseek-flash, API 계정 1개</text>
<text x="48" y="1651" font-size="15" fill="#626262">koda 0.1.0 @ 6d242f2 · opencode 1.18.33 · Hermes Agent 2026.9.24</text>
<text x="48" y="1673" font-size="15" fill="#626262">비용 = DeepSeek 정가 PEAK 기준(100만 토큰당 캐시 적중 $0.006, 캐시 미스 $0.30, 출력 $1.20). 실제 실행은 비피크 시간대라 청구액은 이 값의 50%</text>
<text x="48" y="1695" font-size="15" fill="#626262">짝 비교 = 같은 라운드의 (도구 ÷ koda) 비율 중앙값. 세 도구는 매 라운드 동시에 실행</text>
<text x="48" y="1717" font-size="15" fill="#626262">n 이 작고(과제·도구당 5런 또는 3런) 유의성 검정은 하지 않았다.</text>
<text x="48" y="1745" font-size="16" fill="#262626"><tspan fill='#262626'>전체 결과(koda 가 뒤처진 항목 포함): </tspan><tspan fill='#0055dc' font-family='ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace'>benchmarks/</tspan></text>
