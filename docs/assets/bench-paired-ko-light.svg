<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1775" viewBox="0 0 1200 1775" role="img" aria-labelledby="paired-title paired-desc" lang="ko" xml:lang="ko" font-family='"Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif'>
<title id="paired-title">koda 벤치마크: opencode·Hermes Agent 와의 짝 비교 배수</title>
<desc id="paired-desc">(도구 ÷ koda) 짝 비교 중앙값의 롤리팝 차트, 로그 눈금, 런 main-20260930, 2026-09-30, deepseek-flash. 편집 과제와 전체 라운드에서 opencode 는 koda 보다 시간과 비용을 덜 썼고, Hermes Agent 는 비용과 토큰을 더 썼다. koda 가 두 도구보다 덜 쓴 것은 짧은 질문에서뿐이다. 소요 시간(전체 42라운드): opencode 0.66배, koda 가 빠른 라운드 2/42; Hermes Agent 1.05배, koda 가 빠른 라운드 24/42; 중앙값 27.0초 / 13.0초 / 27.4초 [koda 뒤처짐]; 소요 시간, 편집 과제(20라운드): opencode 0.64배, koda 가 빠른 라운드 2/20; Hermes Agent 1.02배, koda 가 빠른 라운드 10/20; 중앙값 35.5초 / 24.0초 / 35.4초 [koda 뒤처짐]; 비용(전체 42라운드, PEAK 기준): opencode 0.92배, koda 가 싼 라운드 19/42; Hermes Agent 1.67배, koda 가 싼 라운드 36/42; 중앙값 $0.0079 / $0.0052 / $0.0109 [koda 뒤처짐]; 비용, 편집 과제(20라운드): opencode 0.76배, koda 가 싼 라운드 2/20; Hermes Agent 1.21배, koda 가 싼 라운드 15/20; 중앙값 $0.0125 / $0.0099 / $0.0153 [koda 뒤처짐]; 비용, 질문(e1 + f1, 10라운드, 런마다 새 디렉터리에서 단발 실행 ¹): opencode 2.52배, koda 가 싼 라운드 10/10; Hermes Agent 4.60배, koda 가 싼 라운드 10/10; 중앙값 $0.0015 / $0.0031 / $0.0050 [koda 앞섬]; 입력 토큰(전체 42라운드, 캐시 적중분 포함): opencode 0.94배, koda 가 적은 라운드 20/42; Hermes Agent 2.70배, koda 가 적은 라운드 37/42; 중앙값 78,670 / 52,428 / 148,932 [koda 뒤처짐]; 입력 토큰, 질문(e1 + f1, 10라운드 ¹): opencode 1.96배, koda 가 적은 라운드 10/10; Hermes Agent 4.59배, koda 가 적은 라운드 10/10; 중앙값 9,969 / 17,491 / 39,380 [koda 앞섬]; 출력 토큰(전체 42라운드, 사고 토큰 포함): opencode 0.77배, koda 가 적은 라운드 12/42; Hermes Agent 1.15배, koda 가 적은 라운드 26/42; 중앙값 3,871 / 2,107 / 3,843 [koda 뒤처짐]; 모델 호출(전체 42라운드): opencode 0.53배, koda 가 적은 라운드 1/42; Hermes Agent 0.70배, koda 가 적은 라운드 2/42; 중앙값 14 / 7 / 9 [koda 뒤처짐]. 속도와 호출: koda 는 라우터, coder, verifier 를 차례로 돌리고 필요하면 planner 와 reviewer 를 더 돌린다(편집 런당 모델 호출 중앙값 20회, 두 도구는 9회와 12.5회). 검증에 실패하면 한 번 더 도는데, 편집 20런 중 3런이 그랬다(b1 r1 163초, d1 r1 126초, d1 r5 128초. 과제 중앙값은 35.5초와 78.6초). ¹ 런마다 이름이 무작위인 새 디렉터리를 썼다. 경로가 없는 koda 프롬프트는 런 사이에 거의 통째로 캐시됐고, 다른 두 도구의 프롬프트는 앞부분 약 1.8k·2.6k 토큰만 재사용됐다. 캐시가 전혀 없을 때의 비용 배수는 1.6배 / 3.6배, 입력이 전부 캐시될 때는 0.90배 / 1.15배라서 이 질문들에서도 koda 가 opencode 보다 싸지 않다. 편집 과제에서는 opencode 가 더 쌌다. opencode 의 토큰 수는 이 중 2런에서 하한값이다(계측되지 않은 요청이 런마다 1건). 비용은 DeepSeek 정가 PEAK 기준. n 이 작고 유의성 검정은 하지 않았다. 전체 결과(koda 가 뒤처진 항목 포함): benchmarks/</desc>
