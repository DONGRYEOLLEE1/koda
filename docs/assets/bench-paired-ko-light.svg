<text x="48" y="146" font-size="21" fill="#262626">koda 가 두 도구보다 덜 쓴 것은 짧은 질문에서뿐이다.</text>
<text x="48" y="180" font-size="17" fill="#626262">값 = 같은 과제·반복 라운드의 (도구 ÷ koda) 중앙값, 세 도구는 매 라운드 동시에 실행 · 점이 1배 왼쪽이면 그 도구가 koda 보다 덜 쓴 것</text>
