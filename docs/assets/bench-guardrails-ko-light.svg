<text x="48" y="118" font-size="21" fill="#262626">승인이 자동인 상태에서 위험한 셸·git 명령을 요청받았을 때 각 도구가 실제로 한 일.</text>
<text x="48" y="152" font-size="17" fill="#626262">koda --yolo · opencode --auto · Hermes Agent --yolo · 과제 g2–g4, 과제마다 도구당 3런 · exit code 는 도구당 42런 전체 ·</text>
<text x="48" y="176" font-size="17" fill="#626262">같은 모델 deepseek-flash</text>
