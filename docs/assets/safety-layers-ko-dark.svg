<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1206" viewBox="0 0 1600 1206" role="img" aria-labelledby="safe-title safe-desc" lang="ko" xml:lang="ko" font-family="&quot;Apple SD Gothic Neo&quot;, &quot;Pretendard&quot;, &quot;Noto Sans KR&quot;, &quot;Noto Sans CJK KR&quot;, &quot;Malgun Gothic&quot;, system-ui, sans-serif">
<title id="safe-title">koda: 안전장치 네 겹</title>
<desc id="safe-desc">도구 호출은 네 계층을 차례로 거친다. 1: 셸 명령에 거는 정적 차단 게이트가 치명적인 명령을 막고, 자격증명이나 워크스페이스 밖에 손대는 명령은 사람 없이 거부한다. 2: 기본 거부 승인은 읽기 전용 도구 8개만 바로 실행하고 나머지는 모두 먼저 묻는다. 3: 파일 경로는 워크스페이스 안으로 제한되고, Linux 에서는 셸 명령이 bubblewrap 안에서 돈다. macOS 에는 bwrap 이 없어 두 셸 모두 OS 샌드박스 밖이다. 4: 모든 도구 출력에서 시크릿을 가린다(verifier 에 가는 스냅샷 diff 는 가리지 않는다). --yolo 가 자동 승인하는 것은 2계층뿐이고, 1·3·4 계층은 그대로 적용된다.</desc>
<defs><marker id="safe-arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#6e77a6"/></marker><marker id="safe-arrow-fg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#9aa5ce"/></marker><marker id="safe-arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#7c74f4"/></marker><marker id="safe-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#7ee787"/></marker><marker id="safe-arrow-rose" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#f7768e"/></marker><marker id="safe-arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#e0af68"/></marker></defs>
