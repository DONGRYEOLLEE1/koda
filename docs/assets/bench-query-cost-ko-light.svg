<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="959" viewBox="0 0 1200 959" role="img" aria-labelledby="qcost-title qcost-desc" lang="ko" xml:lang="ko" font-family="&quot;Apple SD Gothic Neo&quot;, &quot;Pretendard&quot;, &quot;Noto Sans KR&quot;, &quot;Noto Sans CJK KR&quot;, &quot;Malgun Gothic&quot;, system-ui, sans-serif">
<title id="qcost-title">koda 코드 읽기·일반 질문의 런당 비용</title>
<desc id="qcost-desc">가로 막대 차트. 코드 읽기·일반 질문(과제 e1·f1, 도구당 10런, 모두 정답)을 런마다 새 디렉터리에서 단발 실행한 런당 비용 중앙값, DeepSeek 정가 PEAK 기준: koda $0.0015, opencode $0.0031(짝 비교 koda 의 2.5배, koda 가 싼 라운드 10/10), Hermes Agent $0.0050(4.6배, koda 가 싼 라운드 10/10). 조건: 런마다 새 디렉터리를 써서 opencode·Hermes 프롬프트가 캐시되지 않았다. 입력 토큰이 전부 캐시되면 짝 비교 배수는 0.90배 / 1.15배로 koda 가 opencode 보다 싸지 않다. 편집 과제에서는 opencode 가 더 싸다. 런 main-20260930, 2026-09-30, deepseek-flash. 전체 결과(koda 가 뒤처진 항목 포함): benchmarks/</desc>
