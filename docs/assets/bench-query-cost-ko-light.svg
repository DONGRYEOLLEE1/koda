<text x="72" y="664" font-size="19" fill="#262626" data-box="qcost-cond">런마다 이름이 무작위인 새 디렉터리를 써서 opencode·Hermes 프롬프트가 캐시되지 않았다. 두 도구의 시스템</text>
<text x="72" y="691" font-size="19" fill="#262626" data-box="qcost-cond">프롬프트에는 런마다 달라지는 내용(아마도 경로)이 들어가고, koda 프롬프트에는 경로가 없다. 전부 캐시되면 koda 가</text>
<text x="72" y="718" font-size="19" fill="#262626" data-box="qcost-cond">opencode 보다 싸지 않다. 편집 과제에서는 opencode 가 더 싸다.</text>
<text x="72" y="751" font-size="16" fill="#626262" data-box="qcost-cond">opencode / Hermes 짝 비교 배수: 실측 2.5배 / 4.6배 · 캐시가 전혀 없으면 1.6배 / 3.6배 · 입력 토큰이 전부 캐시되면 0.90배 / 1.15배. 캐시</text>
<text x="72" y="774" font-size="16" fill="#626262" data-box="qcost-cond">적중 분량은 프롬프트 길이와 캐시 수치로 추정한 것이고, 요청 본문은 기록하지 않았다.</text>
<text x="48" y="835" font-size="15" fill="#626262">런 main-20260930 · 2026-09-30 12:13-12:42 UTC · 세 도구 모두 deepseek-flash, API 계정 1개 · koda 0.1.0 @ 6d242f2 · opencode 1.18.33 ·</text>
<text x="48" y="857" font-size="15" fill="#626262">Hermes Agent 2026.9.24</text>
<text x="48" y="879" font-size="15" fill="#626262">비용 = DeepSeek 정가 PEAK 기준(100만 토큰당 cache hit $0.006, cache miss $0.30, 출력 $1.20). 실제 실행은 off-peak 라 청구액은 이 값의 50% ·</text>
<text x="48" y="901" font-size="15" fill="#626262">짝 비교 = 같은 라운드 10쌍의 (도구 ÷ koda) 비용 비율 중앙값</text>
