<text x="48" y="118" font-size="21" fill="#262626">런마다 새 디렉터리에서 단발 실행: opencode 의 약 절반, Hermes 의 1/3 이하.</text>
<text x="48" y="152" font-size="17" fill="#626262">과제 e1(여러 모듈을 따라가야 하는 코드 읽기) + f1(일반 지식) · 도구당 10런 · 세 도구 모두 정답 10/10 · 같은 모델 deepseek-flash</text>
