<path d="M180 730 H90 Q80 730 80 740 V958 Q80 968 90 968 H98" fill="none" stroke="#7c74f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-primary)"/>
<text x="96" y="722" font-size="14" fill="#a59ffb" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">no</text>
<path d="M260 894 V926" fill="none" stroke="#7c74f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-primary)"/>
