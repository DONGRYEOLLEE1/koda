<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1720" viewBox="0 0 480 1720" role="img" aria-labelledby="archc-title archc-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif">
<title id="archc-title">koda agent graph (compact)</title>
<desc id="archc-desc">A router sends each request down one path. answer, reader and investigator hold no write tools and end without verification. The edit path runs an optional planner, a coder with write tools and a verifier that judges a hash-snapshot diff plus the observed tool log, retrying once on failure. Every tool call passes a deny gate, default-deny approval (the only layer --yolo skips), workspace confinement and secret redaction.</desc>
<defs><marker id="archc-arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#6e77a6"/></marker><marker id="archc-arrow-fg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#9aa5ce"/></marker><marker id="archc-arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#7c74f4"/></marker><marker id="archc-arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#7ee787"/></marker><marker id="archc-arrow-rose" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#f7768e"/></marker><marker id="archc-arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#e0af68"/></marker></defs>
<rect width="480" height="1720" fill="#191a24"/>
<text x="20" y="46" font-size="28" fill="#c0caf5"><tspan fill="#e6e9ff" font-weight="800">koda</tspan><tspan fill="#9aa5ce" font-weight="400">  agent graph</tspan></text>
<text x="20" y="78" font-size="17" fill="#9aa5ce">Each request takes the narrowest path.</text>
<text x="20" y="101" font-size="17" fill="#9aa5ce">Only the edit path gets write tools,</text>
<text x="20" y="124" font-size="17" fill="#9aa5ce">and only it is verified.</text>
<rect x="20" y="148" width="440" height="78" rx="14" fill="#2a2d3e" stroke="#5b6390" stroke-width="2" id="archc-route"/>
<text x="40" y="186" font-size="28" font-weight="700" fill="#e6e9ff" data-box="archc-route">route</text>
<text x="128" y="184" font-size="16" fill="#9aa5ce" data-box="archc-route">1 structured LLM call</text>
<text x="40" y="212" font-size="16" fill="#9aa5ce" data-box="archc-route">unparseable reply → inspect (read-only)</text>
<rect x="60" y="274" width="400" height="310" rx="16" fill="#22242f" stroke="#3b3f57" stroke-width="1.5" id="archc-readg"/>
<text x="78" y="304" font-size="14" font-weight="800" fill="#9aa5ce" letter-spacing="1.4" data-box="archc-readg">READ PATHS</text>
<text x="78" y="324" font-size="16" fill="#9aa5ce" data-box="archc-readg">no write tools · no verify step</text>
<path d="M78 338 H442" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="366" font-size="22" font-weight="700" fill="#e6e9ff" data-box="archc-readg">answer</text>
<rect x="294" y="347" width="148" height="24" rx="12" fill="#22242f" stroke="#9aa5ce" stroke-width="1.5" id="archc-chip13"/>
<text x="368" y="363.68" font-size="13" font-weight="700" fill="#9aa5ce" text-anchor="middle" letter-spacing="0.8" data-box="archc-chip13">NO FILE TOOLS</text>
<text x="78" y="388" font-size="16" fill="#9aa5ce" data-box="archc-readg">general questions · MCP · vision</text>
<path d="M78 400 H442" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="428" font-size="22" font-weight="700" fill="#e6e9ff" data-box="archc-readg">reader</text>
<rect x="334" y="409" width="108" height="24" rx="12" fill="#22242f" id="archc-chip18-bg"/>
