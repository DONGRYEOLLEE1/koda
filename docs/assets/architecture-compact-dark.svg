<text x="78" y="450" font-size="16" fill="#9aa5ce" data-box="archc-readg">files + read-only shell · explore</text>
<path d="M78 462 H442" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="490" font-size="22" font-weight="700" fill="#e6e9ff" data-box="archc-readg">investigator</text>
<rect x="334" y="471" width="108" height="24" rx="12" fill="#22242f" id="archc-chip24-bg"/>
<rect x="334" y="471" width="108" height="24" rx="12" fill="#c0caf5" fill-opacity="0.12" stroke="#c0caf5" stroke-width="1" id="archc-chip24"/>
<text x="388" y="487.68" font-size="13" font-weight="700" fill="#c0caf5" text-anchor="middle" letter-spacing="0.8" data-box="archc-chip24">READ-ONLY</text>
<text x="78" y="512" font-size="16" fill="#9aa5ce" data-box="archc-readg">same tools, shell-first</text>
<path d="M78 524 H442" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="548" font-size="15" fill="#e0af68" data-box="archc-readg">macOS has no bwrap: the auto-approved</text>
<text x="78" y="570" font-size="15" fill="#e0af68" data-box="archc-readg">read-only shell can still write files</text>
<path d="M36 292 Q36 304 48 304 H58" fill="none" stroke="#6e77a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-muted)"/>
<text x="62" y="264" font-size="14" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">route = answer · read · inspect</text>
<text x="442" y="304" font-size="14" font-weight="700" fill="#c0caf5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace" data-box="archc-readg">→ END</text>
<rect x="60" y="628" width="400" height="606" rx="16" fill="#7c74f4" fill-opacity="0.1" stroke="#7c74f4" stroke-width="2" id="archc-editg"/>
<text x="78" y="658" font-size="14" font-weight="800" fill="#a59ffb" letter-spacing="1.4" data-box="archc-editg">EDIT PATH</text>
<text x="78" y="678" font-size="16" fill="#9aa5ce" data-box="archc-editg">only path with write tools · verified</text>
<path d="M36 646 Q36 658 48 658 H58" fill="none" stroke="#7c74f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-primary)"/>
<text x="62" y="618" font-size="14" fill="#a59ffb" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">route = edit</text>
<path d="M36 226 V646" fill="none" stroke="#6e77a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="180" y="712" width="160" height="36" rx="18" fill="#191a24" stroke="#7c74f4" stroke-width="2" id="archc-pill"/>
<text x="260" y="735" font-size="15" fill="#c0caf5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace" data-box="archc-pill">plan_needed?</text>
<rect x="100" y="782" width="320" height="112" rx="14" fill="#191a24" stroke="#7c74f4" stroke-width="2" stroke-dasharray="8 6" id="archc-plan"/>
<text x="118" y="820" font-size="26" font-weight="700" fill="#e6e9ff" data-box="archc-plan">plan</text>
<rect x="296" y="798" width="108" height="24" rx="12" fill="#191a24" id="archc-chip44-bg"/>
<rect x="296" y="798" width="108" height="24" rx="12" fill="#c0caf5" fill-opacity="0.12" stroke="#c0caf5" stroke-width="1" id="archc-chip44"/>
<text x="350" y="814.68" font-size="13" font-weight="700" fill="#c0caf5" text-anchor="middle" letter-spacing="0.8" data-box="archc-chip44">READ-ONLY</text>
<text x="118" y="850" font-size="16" fill="#c0caf5" data-box="archc-plan">≤ 5-item checklist, enforced</text>
<text x="118" y="874" font-size="16" fill="#9aa5ce" data-box="archc-plan">optional · no-think · ≤ 15</text>
<rect x="100" y="928" width="320" height="112" rx="14" fill="#191a24" stroke="#7c74f4" stroke-width="2.5" id="archc-coder"/>
<text x="118" y="966" font-size="26" font-weight="700" fill="#e6e9ff" data-box="archc-coder">coder</text>
<rect x="266" y="944" width="138" height="24" rx="12" fill="#7c74f4" id="archc-chip51"/>
<text x="335" y="960.68" font-size="13" font-weight="700" fill="#14151d" text-anchor="middle" letter-spacing="0.8" data-box="archc-chip51">READ + WRITE</text>
<text x="118" y="996" font-size="16" fill="#c0caf5" data-box="archc-coder">run_command · 6 edit tools</text>
<text x="118" y="1020" font-size="16" fill="#9aa5ce" data-box="archc-coder">snapshots the workspace first</text>
<rect x="100" y="1074" width="320" height="136" rx="14" fill="#191a24" stroke="#7ee787" stroke-width="2.5" id="archc-verify"/>
<text x="118" y="1112" font-size="26" font-weight="700" fill="#e6e9ff" data-box="archc-verify">verify</text>
<rect x="306" y="1090" width="98" height="24" rx="12" fill="#191a24" stroke="#9aa5ce" stroke-width="1.5" id="archc-chip57"/>
<text x="355" y="1106.68" font-size="13" font-weight="700" fill="#9aa5ce" text-anchor="middle" letter-spacing="0.8" data-box="archc-chip57">NO TOOLS</text>
<text x="118" y="1142" font-size="16" fill="#c0caf5" data-box="archc-verify">hash-snapshot diff + tool log</text>
<text x="118" y="1166" font-size="16" fill="#c0caf5" data-box="archc-verify">→ one structured verdict</text>
<text x="118" y="1190" font-size="16" fill="#f7768e" data-box="archc-verify">fail → retry once</text>
<path d="M260 748 V780" fill="none" stroke="#7c74f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-primary)"/>
