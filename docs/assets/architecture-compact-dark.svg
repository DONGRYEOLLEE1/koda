<text x="428" y="722" font-size="14" fill="#f7768e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">fail, once</text>
<path d="M260 1210 V1272" fill="none" stroke="#7c74f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#archc-arrow-primary)"/>
<text x="248" y="1260" font-size="14" fill="#a59ffb" text-anchor="end" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">pass, or retry used</text>
<rect x="175" y="1274" width="170" height="36" rx="18" fill="#2a2d3e" stroke="#5b6390" stroke-width="1.5" id="archc-end"/>
<text x="260" y="1298" font-size="16" font-weight="700" fill="#e6e9ff" text-anchor="middle" data-box="archc-end">END</text>
<text x="20" y="1360" font-size="14" font-weight="800" fill="#9aa5ce" letter-spacing="1.4">EVERY TOOL CALL</text>
<text x="20" y="1382" font-size="16" fill="#9aa5ce">four safety layers, in this order</text>
<rect x="20" y="1400" width="440" height="264" rx="14" fill="#22242f" stroke="#3b3f57" stroke-width="1.5" id="archc-layers"/>
<circle cx="50" cy="1436" r="13" fill="#7c74f4" stroke="#7c74f4" stroke-width="1.5"/>
<text x="50" y="1441.04" font-size="14" font-weight="800" fill="#14151d" text-anchor="middle">1</text>
<text x="76" y="1431" font-size="18" font-weight="700" fill="#e6e9ff" data-box="archc-layers">Deny gate</text>
<text x="76" y="1454" font-size="16" fill="#9aa5ce" data-box="archc-layers">catastrophic shell commands blocked</text>
<path d="M36 1468 H444" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="50" cy="1500" r="13" fill="#e0af68" stroke="#e0af68" stroke-width="1.5"/>
<text x="50" y="1505.04" font-size="14" font-weight="800" fill="#14151d" text-anchor="middle">2</text>
<text x="76" y="1495" font-size="18" font-weight="700" fill="#e6e9ff" data-box="archc-layers">Approval, default deny</text>
<text x="76" y="1518" font-size="16" fill="#e0af68" data-box="archc-layers">--yolo auto-approves only this layer</text>
<path d="M36 1532 H444" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="50" cy="1564" r="13" fill="#7c74f4" stroke="#7c74f4" stroke-width="1.5"/>
<text x="50" y="1569.04" font-size="14" font-weight="800" fill="#14151d" text-anchor="middle">3</text>
<text x="76" y="1559" font-size="18" font-weight="700" fill="#e6e9ff" data-box="archc-layers">Workspace confinement</text>
<text x="76" y="1582" font-size="16" fill="#9aa5ce" data-box="archc-layers">file paths always; shells via bwrap (Linux)</text>
<path d="M36 1596 H444" fill="none" stroke="#3b3f57" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="50" cy="1628" r="13" fill="#7c74f4" stroke="#7c74f4" stroke-width="1.5"/>
<text x="50" y="1633.04" font-size="14" font-weight="800" fill="#14151d" text-anchor="middle">4</text>
<text x="76" y="1623" font-size="18" font-weight="700" fill="#e6e9ff" data-box="archc-layers">Secret redaction</text>
<text x="76" y="1646" font-size="16" fill="#9aa5ce" data-box="archc-layers">masks keys and tokens in tool output</text>
<text x="20" y="1698" font-size="13" fill="#9aa5ce" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">koda @ 6d242f2 · compact view of architecture-*.svg</text>
