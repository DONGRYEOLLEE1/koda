<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1206" viewBox="0 0 1600 1206" role="img" aria-labelledby="safe-title safe-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif">
<title id="safe-title">koda: four safety layers</title>
<desc id="safe-desc">A tool call passes four layers in order. 1: a static deny gate on shell commands blocks catastrophic commands and refuses credential or out-of-workspace access without a human. 2: default-deny approval lets eight read-only tools run and asks before everything else. 3: file paths are confined to the workspace, and on Linux shell commands run inside bubblewrap; macOS has no bwrap, so neither shell is OS-sandboxed. 4: secrets are redacted from every tool output (the snapshot diff given to the verifier is not redacted). The --yolo flag only auto-approves layer 2; layers 1, 3 and 4 still apply.</desc>
