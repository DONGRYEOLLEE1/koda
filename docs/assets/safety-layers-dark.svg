<text x="48" y="102" font-size="19" fill="#9aa5ce"><tspan fill="#e0af68" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace">--yolo</tspan><tspan > only skips the approval prompt. The deny gate, the workspace sandbox and output redaction still apply.</tspan></text>
