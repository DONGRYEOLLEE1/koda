<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목 책방 · 이달의 추천</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">골목 책방</a>
  <nav class="menu">
    <a href="#picks">추천</a>
    <a href="#events">행사</a>
    <a href="#about">소개</a>
  </nav>
</header>
<main>
  <section class="intro">
    <h1 id="picks">이달의 추천</h1>
    <p class="lead">서점 직원들이 이번 달에 직접 읽고 고른 네 권입니다.</p>
  </section>
  <section id="cards" class="cards">
    <article class="card">
      <div class="cover tone-1" aria-hidden="true"></div>
      <h2 class="title">밤의 도서관</h2>
      <p class="author">김하늘</p>
      <p class="price">14,000원</p>
      <button type="button" class="buy">장바구니 담기</button>
    </article>
    <article class="card">
      <div class="cover tone-2" aria-hidden="true"></div>
      <h2 class="title">느린 바다</h2>
      <p class="author">박서윤</p>
      <p class="price">16,500원</p>
      <button type="button" class="buy">장바구니 담기</button>
    </article>
    <article class="card">
      <div class="cover tone-3" aria-hidden="true"></div>
      <h2 class="title">정원사의 수첩</h2>
      <p class="author">이도현</p>
      <p class="price">13,200원</p>
      <button type="button" class="buy">장바구니 담기</button>
    </article>
    <article class="card">
      <div class="cover tone-4" aria-hidden="true"></div>
      <h2 class="title">작은 기계들</h2>
      <p class="author">최유진</p>
      <p class="price">18,000원</p>
      <button type="button" class="buy">장바구니 담기</button>
    </article>
  </section>
  <section id="events" class="note">
    <h2>이번 달 행사</h2>
    <p>매주 토요일 오후 3시, 추천 도서 낭독회가 열립니다.</p>
  </section>
</main>
<footer id="about">
  <p>골목 책방 · 서울 종로구 자하문로 7 · 화-일 11:00-20:00</p>
</footer>
<script src="app.js"></script>
</body>
</html>
