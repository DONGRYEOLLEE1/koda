<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목 책방 · 이달의 추천</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">골목 책방</a>
  <nav class="menu">
    <a href="#picks">추천</a>
    <a href="#events">행사</a>
    <a href="#about">소개</a>
  </nav>
</header>
<main>
  <section class="intro">
    <h1 id="picks">이달의 추천</h1>
    <p class="lead">서점 직원들이 이번 달에 직접 읽고 고른 네 권입니다.</p>
  </section>
  <section id="cards" class="cards"></section>
  <template id="card-tpl">
    <article class="card">
      <div class="cover" aria-hidden="true"></div>
      <h2 class="title"></h2>
      <p class="author"></p>
      <p class="price"></p>
      <button type="button" class="buy">장바구니 담기</button>
    </article>
  </template>
  <section id="events" class="note">
    <h2>이번 달 행사</h2>
    <p>매주 토요일 오후 3시, 추천 도서 낭독회가 열립니다.</p>
  </section>
</main>
<footer id="about">
  <p>골목 책방 · 서울 종로구 자하문로 7 · 화-일 11:00-20:00</p>
</footer>
<script src="app.js"></script>
</body>
</html>
