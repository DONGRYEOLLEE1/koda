<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물결 노트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">물결 노트</a>
  <nav class="menu">
    <a href="#features">기능</a>
    <a href="#pricing">요금제</a>
    <a href="#faq">질문</a>
  </nav>
</header>
<main>
  <section id="hero" class="hero">
    <h1>생각을 기록하세요</h1>
    <p class="lead">떠오르는 순간에 적고, 나중에 검색 한 번으로 다시 꺼내는 메모 앱입니다.</p>
    <a class="button primary" href="#pricing">시작하기</a>
  </section>
  <section id="features" class="features">
    <h2>주요 기능</h2>
    <div class="grid">
      <div class="feature">
        <h3>빠른 검색</h3>
        <p>수천 개의 메모에서도 0.1초 안에 찾습니다.</p>
      </div>
      <div class="feature">
        <h3>오프라인 동기화</h3>
        <p>연결이 끊겨도 적고, 다시 연결되면 자동으로 맞춥니다.</p>
      </div>
      <div class="feature">
        <h3>팀 공유</h3>
        <p>메모 하나를 링크로 만들어 누구에게나 보낼 수 있습니다.</p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
