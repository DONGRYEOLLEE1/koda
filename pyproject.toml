[project]
name = "koda"
version = "0.1.0"
description = "A LangGraph coding agent that routes each request to the narrowest path and checks edits against diff and tool-log evidence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langfuse>=4.12.0",
    "langgraph>=1.2.7",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0,<15",
]

[project.optional-dependencies]
# 자동화/파이프 경로는 textual 없이 동작해야하므로 일반 의존성이 아닌 extra 로 둔다 — 미설치 시 `tui` 명령이 설치 안내를 출력한다.
tui = [
    "textual>=8.2,<9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
koda = "koda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 프롬프트(.md)는 런타임에 load_prompt 가 읽는 패키지 내부 데이터 — wheel 에 반드시 포함.
# 없으면 설치 후 첫 load_prompt 호출이 FileNotFoundError 로 죽는다 (plan/KODA_MIGRATION §2.1).
[tool.setuptools.package-data]
"koda.prompts" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# src-layout: 타입체커/IDE가 koda 를 해석하도록 경로 추가
[tool.pyright]
extraPaths = ["src"]
