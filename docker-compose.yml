name: build-harness-langfuse

# build-harness 전용 langfuse 스택. 프로젝트명으로 컨테이너/볼륨/네트워크가 격리되어
# 다른 langfuse 인스턴스와 충돌하지 않는다. web UI 는 http://localhost:3002.
# API 키는 LANGFUSE_INIT_* 로 부트스트랩되어 아래 값이 그대로 .env 에 쓰인다.

x-lf-env: &lf_env
  DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
  SALT: "bh-salt-4e937c539b348f4b2b20a4b10fd42304"
  ENCRYPTION_KEY: "eebb28d9f15681901f51397e88a3f053ffe5cbf5065d2854f326c5af9c3c2ecb"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: myredissecret
  REDIS_TLS_ENABLED: "false"

x-lf-deps: &lf_deps
  langfuse-postgres:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

services:
  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["--requirepass", "myredissecret", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: *lf_deps
    environment: *lf_env

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *lf_deps
    ports:
      - "3002:3000"
    environment:
      <<: *lf_env
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: "bh-nextauth-d0a50595f57d119c34924f313d1949d475cacee40ce4bc21"
      LANGFUSE_INIT_ORG_ID: org-build-harness
      LANGFUSE_INIT_ORG_NAME: build-harness
      LANGFUSE_INIT_PROJECT_ID: proj-build-harness
      LANGFUSE_INIT_PROJECT_NAME: build-harness
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-a1b2c3d4-0000-4000-8000-000000000001
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-a1b2c3d4-0000-4000-8000-000000000002
      LANGFUSE_INIT_USER_EMAIL: admin@build-harness.local
      LANGFUSE_INIT_USER_NAME: BH Admin
      LANGFUSE_INIT_USER_PASSWORD: buildharness1234

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
